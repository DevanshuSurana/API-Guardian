
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "api-guardian-mlops"
version = "0.1.0"
requires-python = ">=3.13,<3.15"

[tool.setuptools.packages.find]
include = ["mlops*"]
exclude = ["datasets*", "tests*"]

[tool.pytest.ini_options]
pythonpath = [".", "backend", "ai_agent"]
testpaths = ["tests", "backend/tests", "ai_agent/tests"]
addopts = ["-m", "not integration"]
markers = [
    "integration: requires a running local Ollama service or external GitHub access",
]
